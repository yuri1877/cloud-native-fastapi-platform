[project]
name = "cloud-native-fastapi-platform"
version = "0.1.0"
description = "Production-grade cloud-native FastAPI platform on AWS (reference implementation)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic[email]>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "pyjwt[crypto]>=2.9,<3.0",
    "boto3>=1.34,<2.0",
    "sqlalchemy>=2.0.35,<2.1",
    "greenlet>=3.1,<4.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "prometheus-client>=0.20,<1.0",
    "opentelemetry-api>=1.25,<2.0",
    "opentelemetry-sdk>=1.25,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6",
    "mypy>=1.11,<2.0",
    "openapi-spec-validator>=0.7,<1.0",
    "jsonschema>=4.20,<5.0",
    "pytest-cov>=5.0,<8.0",
    "pre-commit>=3.7,<5.0",
    "boto3-stubs[sqs]>=1.34,<2.0",
    "mypy-boto3-events>=1.34,<2.0",
    "moto[sqs,events]>=5.0,<6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config -ra"
xfail_strict = true
markers = [
    "contract: the generated OpenAPI document, and real responses checked against it",
    "e2e: end-to-end journeys across the API, database, queue and worker (need TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"**/tests/**" = ["S101"]
"**/test_*.py" = ["S101"]
"**/conftest.py" = ["S101"]

[tool.mypy]
files = ["app", "worker"]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["app", "worker"]
branch = true
# SQLAlchemy's async layer runs code in greenlets; without this, lines executed inside them
# (the repositories, the services) are under-reported.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '^\s*\.\.\.$',
    'if __name__ == "__main__":',
]
