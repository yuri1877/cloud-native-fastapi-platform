# Opens pull requests for outdated or vulnerable Python dependencies, which is how a finding from
# scripts/security.sh deps usually gets fixed. Base images are pinned through build arguments,
# which Dependabot cannot read; they are bumped by hand (see docs/security/scanning.md).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
